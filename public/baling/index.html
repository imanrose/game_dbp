<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Craftverse</title>
<style>
:root{--ink:#243447;--cream:#fff7e8;--coral:#d9644a;--teal:#2f8f83;--mus:#e0a93b;--blue:#3f7cac;--grn:#5d9b5b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:#a8d5e2;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;background:rgba(36,52,71,.3)}
.scr.on{display:flex}
.panel{background:var(--cream);border:5px solid var(--ink);border-radius:26px;padding:24px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(36,52,71,.3)}
.panel h1{margin:6px 0 4px;font-size:clamp(28px,6vw,44px);color:var(--coral)}
.panel p{margin:6px 0 14px;font-size:clamp(16px,2.6vw,20px);line-height:1.4}
.logo{font-size:56px}
.btn{white-space:nowrap;font:inherit;font-weight:800;font-size:18px;color:#fff;background:var(--blue);border:4px solid var(--ink);border-radius:999px;min-height:48px;min-width:48px;padding:6px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(36,52,71,.35);pointer-events:auto}
.btn:active{transform:translateY(3px)}
.btn.big{font-size:clamp(20px,3.6vw,28px);min-height:64px;padding:10px 34px;background:var(--teal)}
.btn.red{background:var(--coral)}.btn.ghost{background:#fff;color:var(--ink)}
.btn.on{background:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center}
.lnk{font-weight:800;font-size:18px;color:var(--blue)}
#hud{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
#hud.on{display:block}
#bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center}
.chip{white-space:nowrap;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px}
.sp{flex:1}
#set{position:absolute;top:64px;right:8px;width:min(340px,94vw);background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:10px 12px;display:none;pointer-events:auto;z-index:6}
#set.on{display:block}
#set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
#set .row b{width:62px;font-size:15px}
#set .btn{font-size:15px;min-height:40px;padding:4px 12px;box-shadow:none;border-width:3px;background:#fff;color:var(--ink)}
#set .btn.on{background:var(--ink);color:#fff}
#mapbox{position:absolute;right:8px;top:64px;width:158px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:4px;text-align:center}
#map{width:100%;display:block;border-radius:10px}
.leg{font-size:10px;font-weight:700;margin-top:2px;white-space:nowrap}
#hud.q #mapbox,#hud.q #dpad{display:none}
#card{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:min(94vw,780px);background:var(--cream);border:5px solid var(--ink);border-radius:22px;padding:12px 16px;text-align:center;display:none;box-shadow:0 6px 0 rgba(36,52,71,.25)}
#card.on{display:block}
#card .k{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;font-size:14px;font-weight:800}
#card .p{font-size:clamp(19px,3.6vw,32px);font-weight:800;margin:8px 0;line-height:1.3}
.blank{display:inline-block;min-width:3.4ch;padding:0 10px;background:#ffe9a8;border:3px dashed var(--ink);border-radius:12px}
.blank.ok{background:#cfe8c8;border:3px solid var(--grn);color:#1f5a2a}
#card .m{background:#e4f1ee;border-left:8px solid var(--teal);border-radius:12px;padding:8px 12px;font-size:clamp(15px,2.6vw,22px);text-align:left}
#card .m span{font-weight:800;color:var(--teal);margin-right:6px}
#card .res{font-size:clamp(18px,3.2vw,26px);font-weight:800}
.res.good{color:#1f5a2a}.res.bad{color:#a23a2a}
#answers{position:absolute;bottom:16px;left:0;right:0;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.ans{font:inherit;font-weight:800;min-width:150px;min-height:64px;padding:8px 18px;font-size:clamp(18px,3.4vw,28px);color:#fff;border:4px solid var(--ink);border-radius:20px;cursor:pointer;box-shadow:0 5px 0 rgba(36,52,71,.4);pointer-events:auto}
.ans:disabled{background:#9aa5ad!important;color:#e6eaed;cursor:default;box-shadow:none}
.ans:active{transform:translateY(3px)}
#toast{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);background:var(--cream);border:4px solid var(--ink);border-radius:999px;padding:8px 22px;font-size:clamp(17px,3.2vw,26px);font-weight:800;display:none;text-align:center;max-width:94vw}
#toast.on{display:block}
#dpad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(3,66px);gap:4px}
#dpad .btn{touch-action:none;font-size:26px;padding:0;border-radius:50%;min-height:0}
#stars{font-size:44px;margin:4px 0}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--cream);z-index:99;padding:24px;font-size:22px;text-align:center}
body.ceria{--ink:#1c2b4a;--cream:#fffbe6;--coral:#fa5252;--teal:#40c057;--blue:#339af0;--grn:#40c057;background:#9be7ff}
body.ceria .panel,body.ceria #card{border-color:#ffd43b}
body.ceria .panel h1{color:#e8590c}
body.ceria .btn,body.ceria .ans{border-color:#fff}
.row2{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:800}
.btn.sm{font-size:15px;min-height:40px;padding:4px 14px}
.btn.sm.ghost.on{background:var(--ink);color:#fff}
@media (max-width:600px){#mapbox{width:112px}.chip{font-size:15px;padding:4px 10px}.lbl{display:none}#bar .btn{padding:4px 12px}.leg{font-size:9px;white-space:normal}#toast{bottom:232px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" class="scr on">
 <div class="panel">
  <div class="logo">🧱</div>
  <h1>Craftverse</h1>
  <p>Baling blok ke tong yang betul.<br>Siapkan peribahasa, dapat pakaian baharu!</p>
  <div class="stack">
   <button class="btn big" id="bGo">▶ Mula</button>
   <button class="btn ghost" id="bReset" style="display:none">↺ Mula Semula</button>
   <div class="row2"><span>🎨 Warna:</span><button class="btn sm ghost th" data-t="ceria">Ceria</button><button class="btn sm ghost th" data-t="lembut">Lembut</button></div>
   <a class="lnk" id="lobi" href="/peribahasa/lobby" style="display:none">🏠 Kembali ke Lobi</a>
  </div>
 </div>
</div>

<div id="hud">
 <div id="bar">
  <button class="btn red" id="bEnd">⏹<span class="lbl"> Tamat</span></button>
  <div class="chip" id="pScore">⭐ 0</div>
  <div class="chip" id="pProg">📍 0/8</div>
  <div class="sp"></div>
  <button class="btn" id="bSet">⚙<span class="lbl"> Tetapan</span></button>
 </div>
 <div id="set">
  <div class="row"><b>🔍 Zum</b><button class="btn" data-k="zoom" data-v="0">Dekat</button><button class="btn" data-k="zoom" data-v="1">Biasa</button><button class="btn" data-k="zoom" data-v="2">Jauh</button></div>
  <div class="row"><b>🏃 Gerak</b><button class="btn" data-k="spd" data-v="0">🐢 Perlahan</button><button class="btn" data-k="spd" data-v="1">🐇 Laju</button></div>
  <div class="row"><b>🔊 Bunyi</b><button class="btn" data-k="vol" data-v="1">Kuat</button><button class="btn" data-k="vol" data-v="0.6">Sederhana</button><button class="btn" data-k="vol" data-v="0">Senyap</button></div>
 </div>
 <div id="mapbox"><canvas id="map" width="280" height="280"></canvas><div class="leg">🔵 Anda · 🟡 Belum · 🟢 Siap</div></div>
 <div id="card"></div>
 <div id="toast"></div>
 <div id="dpad">
  <button class="btn" data-d="u" style="grid-area:1/2">▲</button>
  <button class="btn" data-d="l" style="grid-area:2/1">◀</button>
  <button class="btn" data-d="r" style="grid-area:2/3">▶</button>
  <button class="btn" data-d="d" style="grid-area:3/2">▼</button>
 </div>
 <div id="answers"></div>
</div>

<div id="win" class="scr">
 <div class="panel">
  <h1>🎉 Tahniah! 🎉</h1>
  <div id="stars"></div>
  <p id="winScore" style="font-size:26px;font-weight:800"></p>
  <p>Semua pakaian siap dan mahkota emas dipasang! 👑</p>
  <div class="stack">
   <button class="btn big" id="bAgain">↺ Main Semula</button>
   <button class="btn ghost" id="bDone">⏹ Tamat</button>
  </div>
 </div>
</div>
<div id="fatal"></div>


<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
function fatal(m){var f=$('fatal');if(f){f.textContent=m;f.style.display='flex';}}

function boot(){
var RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var TOTAL=8,PTS=[10,6,3],MAXS=80;
/* Soalan: p = ayat (___ = tempat kosong), w = jawapan, x = pilihan salah, m = maksud */
var QS=[
{e:'⛏️',p:'Diam penggali ___.',w:'BERKARAT',x:['BERKILAT','BERLUBANG'],m:'Ilmu yang tidak diamalkan akan hilang.'},
{e:'🦆',p:'Hendak belajar berenang dapatkan ___, hendak belajar memanjat dapatkan tupai.',w:'ITIK',x:['KUCING','KERBAU'],m:'Hendak belajar sesuatu, carilah orang yang pakar.'},
{e:'🐔',p:'Seperti ayam ___ anak.',w:'MEMATUK',x:['MENARI','MENCIUM'],m:'Ibu bapa menghukum anak untuk membetulkan kelakuan mereka.'},
{e:'🎣',p:'Kalau kail panjang sejengkal, lautan dalam usah ___.',w:'DIDUGA',x:['DIMINUM','DIBELI'],m:'Jangan memandang rendah kebolehan orang lain.'},
{e:'🌊',p:'Kalau takut dilambung ___, jangan berumah di tepi pantai.',w:'OMBAK',x:['HUJAN','PASIR'],m:'Jangan ambil risiko jika takut akibatnya.'},
{e:'🔪',p:'Belakang parang kalau diasah lagikan ___.',w:'TAJAM',x:['TUMPUL','BESAR'],m:'Jika berusaha gigih, orang yang kurang pandai akan berjaya juga.'},
{e:'⛵',p:'Malas berdayung, perahu ___.',w:'HANYUT',x:['TERBANG','KERING'],m:'Kejayaan tidak dicapai jika seseorang malas berusaha.'},
{e:'✒️',p:'Alang-alang berdakwat biarlah ___.',w:'HITAM',x:['PUTIH','MERAH'],m:'Jika mengerjakan sesuatu, janganlah sekerat jalan.'}
];
var PN=['Topi','Baju','Hiasan Bahu','Sarung Tangan','Kasut','Jubah','Perisai','Tali Pinggang'];
var SP=[[0,-22],[28,-26],[44,0],[28,28],[0,30],[-28,28],[-44,0],[-28,-26]];
var ZM=[16,26,38],SPD=[3,6];
var SHP=['●','▲','■'];

/* ===== Semua pembolehubah dinyatakan SEBELUM gelung bermula ===== */
var mode='menu',done=new Set(),score=0,won=false,nextI=0;
var qs=null,flight=null,wob=null,pops=[],conf=null,confV=null;
var px=0,pz=10,vx=0,vz=0,ang=Math.PI,ph=0,tm=0,last=0,mapT=0,errN=0,lost=false;
var keys={},touch={};
var AC=null,master=null,mus=null,mp3=null,mp3Ok=null,musTimer=null,wantMusic=false,step=0;
var toastT=null;
var SET={spd:0,zoom:1,vol:0.6,theme:'ceria'};
var data={done:[],score:0,won:false};
try{var s0=JSON.parse(localStorage.getItem('bc2_set')||'{}');
 if(s0&&s0.spd===1)SET.spd=1;if(s0&&s0.theme==='lembut')SET.theme='lembut';if(s0&&(s0.zoom===0||s0.zoom===2))SET.zoom=s0.zoom;if(s0&&(s0.vol===0||s0.vol===1))SET.vol=s0.vol;}catch(e){}
try{var d0=JSON.parse(localStorage.getItem('bc2_prog')||'null');
 if(d0&&Array.isArray(d0.done)){data.done=d0.done.filter(function(n,i,a){return n>=0&&n<TOTAL&&a.indexOf(n)===i;});data.score=Math.max(0,Math.min(MAXS,d0.score|0));data.won=!!d0.won;}}catch(e){}


/* ===== Tema warna: ceria (asal) atau lembut ===== */
var TH={
 ceria:{sky:0x9be7ff,g1:'#8ce99a',g2:'#69db7c',bld:[0xff8787,0x74c0fc,0xffd43b,0xb197fc,0xffa94d,0x63e6be],roof:0xe03131,trunk:0x8d5524,leaf:0x2f9e44,
  ring:0xff922b,ok:0x40c057,plz:0xffd700,blk:0xffd43b,bk:[0xff6b6b,0x4dabf7,0x51cf66],cs:['#ff6b6b','#4dabf7','#51cf66'],
  sg:{f:'#fff3bf',s:'#f08c00',df:'#b2f2bb',ds:'#2f9e44',n:'#d9480f'},
  h:{leg:0x3b82f6,body:0xffd43b,skin:0xffd6a5,mouth:0xe03131,helm:0xe03131,helm2:0xffd43b,chest:0xced4da,sh:0xadb5bd,glove:0xff922b,boot:0x8d5524,cape:0x9c36b5,shield:0x37b24d,belt:0xf59f00,crown:0xffd700}},
 lembut:{sky:0xa8d5e2,g1:'#9cc79a',g2:'#90bd8e',bld:[0xd98b6c,0xe0b560,0x6fb3a8,0x7fa6c9,0xa68bbf,0xe3d3a8],roof:0xb85c45,trunk:0x7b5a3c,leaf:0x4f8f5a,
  ring:0xe0a93b,ok:0x5d9b5b,plz:0xe0a93b,blk:0xe0a93b,bk:[0xd1495b,0x3f7cac,0x7a5c99],cs:['#d1495b','#3f7cac','#7a5c99'],
  sg:{f:'#fff7e8',s:'#e0a93b',df:'#d8ecd3',ds:'#5d9b5b',n:'#243447'},
  h:{leg:0x3f7cac,body:0xe3d3a8,skin:0xf1c9a0,mouth:0xb85c45,helm:0xd9644a,helm2:0xe0a93b,chest:0x2f8f83,sh:0x7a5c99,glove:0xe0a93b,boot:0x7b5a3c,cape:0xd1495b,shield:0x5d9b5b,belt:0xb85c45,crown:0xf2c84b}}
};
var TN=SET.theme==='lembut'?'lembut':'ceria',T=TH[TN],BCOL=T.bk,CS=T.cs;
document.body.className=TN;

/* ===== Three.js ===== */
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});}
catch(e){fatal('Pelayar ini tidak menyokong WebGL 3D. Cuba Chrome atau Edge terkini.');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
$('c').addEventListener('webglcontextlost',function(e){e.preventDefault();lost=true;});
$('c').addEventListener('webglcontextrestored',function(){lost=false;});
var scene=new THREE.Scene();
scene.background=new THREE.Color(T.sky);
scene.fog=new THREE.Fog(T.sky,70,160);
var camera=new THREE.PerspectiveCamera(50,1,0.1,220);
var look=new THREE.Vector3(0,1.5,10);
scene.add(new THREE.HemisphereLight(0xfff4e0,0x7a9a78,0.95));
var sun=new THREE.DirectionalLight(0xffffff,0.45);sun.position.set(30,50,20);scene.add(sun);
function resize(){var w=window.innerWidth||800,h=window.innerHeight||600;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

var MC={},GC={};
function M(c){return MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));}
function G(w,h,d){var k=w+'|'+h+'|'+d;return GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d));}
function bx(w,h,d,c,x,y,z,par){var m=new THREE.Mesh(G(w,h,d),M(c));m.position.set(x,y,z);(par||scene).add(m);return m;}

(function(){
 var cv=document.createElement('canvas');cv.width=cv.height=64;var c=cv.getContext('2d');
 c.fillStyle=T.g1;c.fillRect(0,0,64,64);c.fillStyle=T.g2;c.fillRect(0,0,32,32);c.fillRect(32,32,32,32);
 var t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(40,40);t.magFilter=THREE.NearestFilter;
 var g=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({map:t}));
 g.rotation.x=-Math.PI/2;scene.add(g);
})();

/* ===== Halangan (jarak lapang dijamin) ===== */
var obst=[],placed=[],seed=12345;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function okPos(x,z,big){
 if(Math.hypot(x,z)<14||Math.hypot(x,z-10)<10)return false;
 for(var i=0;i<SP.length;i++){if(Math.hypot(x-SP[i][0],z-SP[i][1])<(big?12:8))return false;}
 for(var j=0;j<placed.length;j++){var o=placed[j];if(Math.hypot(x-o.x,z-o.z)<((big||o.big)?11:8))return false;}
 return true;
}
var BC=T.bld;
var tries=0,nb=0,roofM=M(T.roof);
while(nb<11&&tries<600){tries++;
 var bxp=(rnd()-0.5)*124,bzp=(rnd()-0.5)*124;
 if(!okPos(bxp,bzp,true))continue;
 var bw=4+rnd()*3,bd=4+rnd()*3,bh=4+rnd()*4;
 bx(bw,bh,bd,BC[nb%BC.length],bxp,bh/2,bzp);
 var roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(bw,bd)*0.75,2.2,4),roofM);
 roof.rotation.y=Math.PI/4;roof.position.set(bxp,bh+1.1,bzp);scene.add(roof);
 obst.push({x:bxp,z:bzp,hw:bw/2,hd:bd/2});placed.push({x:bxp,z:bzp,big:true});nb++;}
tries=0;var nt=0,leafG=new THREE.SphereGeometry(1.5,10,8),leafM=M(T.leaf);
while(nt<16&&tries<800){tries++;
 var tx=(rnd()-0.5)*128,tz=(rnd()-0.5)*128;
 if(!okPos(tx,tz,false))continue;
 bx(0.5,2,0.5,T.trunk,tx,1,tz);
 var fol=new THREE.Mesh(leafG,leafM);fol.position.set(tx,3.3,tz);scene.add(fol);
 obst.push({x:tx,z:tz,hw:0.35,hd:0.35});placed.push({x:tx,z:tz,big:false});nt++;}
var PR=0.6;
function blocked(x,z){
 for(var i=0;i<obst.length;i++){var o=obst[i];
  var cx=Math.max(o.x-o.hw,Math.min(x,o.x+o.hw)),cz=Math.max(o.z-o.hd,Math.min(z,o.z+o.hd));
  if((x-cx)*(x-cx)+(z-cz)*(z-cz)<PR*PR)return true;}
 return false;
}

/* ===== Papan tanda (Kanvas 2D) ===== */
function mkSign(e){
 var cv=document.createElement('canvas');cv.width=cv.height=256;
 var tex=new THREE.CanvasTexture(cv);
 var spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
 spr.scale.set(5.2,5.2,1);scene.add(spr);
 return {cx:cv.getContext('2d'),tex:tex,spr:spr,e:e};
}
function drawSign(s,num,dn){
 var c=s.cx;c.clearRect(0,0,256,256);
 c.beginPath();c.arc(128,128,120,0,7);c.fillStyle=dn?T.sg.df:T.sg.f;c.fill();
 c.lineWidth=12;c.strokeStyle=dn?T.sg.ds:T.sg.s;c.stroke();
 c.font='110px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
 c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';
 c.fillText(dn?'✅':s.e,128,112);
 if(num){c.font='bold 52px Arial';c.fillStyle=T.sg.n;c.fillText(String(num),128,205);}
 s.tex.needsUpdate=true;
}
var stations=SP.map(function(p,i){
 var ring=new THREE.Mesh(new THREE.RingGeometry(3.6,4.6,40),new THREE.MeshBasicMaterial({color:T.ring,side:THREE.DoubleSide}));
 ring.rotation.x=-Math.PI/2;ring.position.set(p[0],0.05,p[1]);scene.add(ring);
 var s=mkSign(QS[i].e);s.spr.position.set(p[0],7,p[1]);s.ring=ring;s.x=p[0];s.z=p[1];
 drawSign(s,i+1,false);return s;
});
var plaza=mkSign('👑');plaza.spr.position.set(0,7,0);drawSign(plaza,0,false);
var plRing=new THREE.Mesh(new THREE.RingGeometry(4,5.2,40),new THREE.MeshBasicMaterial({color:T.plz,side:THREE.DoubleSide}));
plRing.rotation.x=-Math.PI/2;plRing.position.y=0.05;scene.add(plRing);

/* ===== Watak + pakaian ===== */
var hero=new THREE.Group();scene.add(hero);
var legL=new THREE.Group(),legR=new THREE.Group(),armL=new THREE.Group(),armR=new THREE.Group();
legL.position.set(-0.3,1,0);legR.position.set(0.3,1,0);armL.position.set(-0.8,2.1,0);armR.position.set(0.8,2.1,0);

function update(dt){
 var sp=0,top=SPD[SET.spd];
 if(mode==='play'&&!qs){
  var ix=((keys.ArrowRight||keys.KeyD||touch.r)?1:0)-((keys.ArrowLeft||keys.KeyA||touch.l)?1:0);
  var iz=((keys.ArrowDown||keys.KeyS||touch.d)?1:0)-((keys.ArrowUp||keys.KeyW||touch.u)?1:0);
  var len=Math.hypot(ix,iz);if(len>0){ix/=len;iz/=len;}
  var k=1-Math.exp(-3*dt);
  vx+=(ix*top-vx)*k;vz+=(iz*top-vz)*k;
  var nx=px+vx*dt;if(!blocked(nx,pz))px=nx;else vx=0;
  var nz=pz+vz*dt;if(!blocked(px,nz))pz=nz;else vz=0;
  px=Math.max(-66,Math.min(66,px));pz=Math.max(-66,Math.min(66,pz));
  sp=Math.hypot(vx,vz);
  if(sp>0.3){var ta=Math.atan2(vx,vz),da=ta-ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;ang+=da*(1-Math.exp(-6*dt));}
  for(var i=0;i<stations.length;i++){
   if(!done.has(i)&&Math.hypot(px-stations[i].x,pz-stations[i].z)<4.6){openQ(i);break;}}
  if(!qs&&done.size===TOTAL&&!won&&Math.hypot(px,pz)<5)victory();
 }
 ph+=dt*sp*2.2;var a=Math.min(1.2,sp/top);
 legL.rotation.x=Math.sin(ph)*0.6*a;legR.rotation.x=-Math.sin(ph)*0.6*a;
 armL.rotation.x=-Math.sin(ph)*0.5*a;armR.rotation.x=Math.sin(ph)*0.5*a;
 hero.position.set(px,(!RM&&sp>0.3)?Math.abs(Math.sin(ph))*0.1:0,pz);hero.rotation.y=ang;
 if(flight){
  flight.t+=dt/0.9;var t=Math.min(1,flight.t);
  block.position.lerpVectors(fa,fb,t);block.position.y+=Math.sin(Math.PI*t)*3;block.rotation.x+=dt*8;
  if(t>=1){var kk=flight.k;flight=null;land(kk);}
 }
 if(wob){wob.t+=dt*3;var w=wob.t>=1?1:1+0.2*Math.sin(wob.t*Math.PI);tgt[wob.k].g.scale.y=w;if(wob.t>=1)wob=null;}
 for(var q=pops.length-1;q>=0;q--){var pp=pops[q];pp.t+=dt*2.5;
  if(pp.t>=1){pp.m.scale.setScalar(1);pops.splice(q,1);}else pp.m.scale.setScalar(pp.t*1.1);}
 if(!RM){
  for(var s=0;s<stations.length;s++)stations[s].spr.position.y=7+Math.sin(tm*2+s)*0.3;plaza.spr.position.y=7+Math.sin(tm*2)*0.3;
  var pu=1+0.07*Math.sin(tm*4);
  if(mode==='play'&&nextI>=0)stations[nextI].ring.scale.set(pu,pu,pu);
  else if(mode==='play'&&!won&&done.size===TOTAL)plRing.scale.set(pu,pu,pu);
 }
 if(confV){var ps=conf.geometry.attributes.position;
  for(var c=0;c<confV.length;c++){var y=ps.array[c*3+1]-confV[c]*dt;if(y<0)y=22;ps.array[c*3+1]=y;}
  ps.needsUpdate=true;}
 var fx=px,fz=pz;if(qs){fx=stations[qs.i].x;fz=stations[qs.i].z-0.5;}
 var D=ZM[SET.zoom],kc=1-Math.exp(-2*dt);
 camera.position.x+=(fx-camera.position.x)*kc;
 camera.position.y+=(D*0.55-camera.position.y)*kc;
 camera.position.z+=(fz+D*0.86-camera.position.z)*kc;
 look.x+=(fx-look.x)*kc;look.y+=(1.5-look.y)*kc;look.z+=(fz-look.z)*kc;
 camera.lookAt(look);
}
function loop(now){
 requestAnimationFrame(loop);
 if(document.hidden){last=now;return;}
 var dt=Math.min(0.05,(now-last)/1000);if(!(dt>=0))dt=0.016;last=now;tm+=dt;
 try{
  update(dt);
  mapT+=dt;if(mapT>0.1&&mode==='play'&&!qs){mapT=0;drawMap();}
  if(!lost)renderer.render(scene,camera);
  errN=0;
 }catch(e){errN++;if(errN===1&&window.console)console.error(e);if(errN>30)fatal('Ralat: '+(e&&e.message?e.message:e)+'. Sila muat semula halaman (Ctrl+F5).');}
}
last=performance.now();
requestAnimationFrame(loop);
}

function run(){try{boot();}catch(e){fatal('Ralat permainan: '+(e&&e.message?e.message:e));}}
var rel=(window.BC_BASE||'')+'three.min.js',abs='/baling/three.min.js';
var cands=(location.protocol==='file:'||location.pathname.indexOf('/baling/')>=0)?[rel,abs]:[abs,rel];
function load(i){
 if(i>=cands.length){fatal('three.min.js tidak dijumpai. Letakkan fail itu dalam public/baling/ dan muat semula (Ctrl+F5).');return;}
 var s=document.createElement('script');s.src=cands[i];
 s.onload=function(){if(typeof THREE==='undefined'){fatal('three.min.js dimuat tetapi BUKAN fail Three.js yang sah. Salin semula isi failnya ke fail baharu.');}else{window.BC_BASE=cands[i].replace('three.min.js','');run();}};
 s.onerror=function(){load(i+1);};
 document.head.appendChild(s);
}
if(typeof THREE!=='undefined'){run();}else{load(0);}
})();
</script>
